# ── Start / Help ─────────────────────────────
start_caption: |
  Hey [{first_name}](tg://user?id={user_id}) 🥀

  I am **Bad Music** !

  A fast & powerful Telegram music player bot.

  Click Help button to see all commands.

start_group: "Thanks for adding me! Use /play to play music. 🎵"

help_text: |
  Choose a category for help.
  Support: {support}

help_admin: |
  **Admin Commands:**
  /pause /resume /skip /stop
  /end — end session + clear all
  /queue — view queue
  /clean — clear cache
  /fav — save favorite
  /setting — room settings
  /active — active rooms (Owner only)

help_auth: |
  **Auth Commands:**
  /auth — authorize user (reply)
  /unauth — remove auth (reply)
  /blacklist — block user (reply)

help_play: |
  **Play Commands:**
  /play songname — search and play
  /play youtube-link — YouTube link
  /song songname — download and send
  Inline: @BadMusicBot songname

help_ping: "/ping — check bot speed"

