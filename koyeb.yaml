name: BadMusic

services:
  - name: badmusic
    type: web

    git:
      repository: https://github.com/Badxd/WebMUsic
      branch: main

    build:
      buildpack: python

    run:
      command: python3 main.py

    env:
      - name: API_ID
        value: ""

      - name: API_HASH
        value: ""

      - name: BOT_TOKEN
        value: ""

      - name: OWNER_ID
        value: ""

      - name: LOGGER_ID
        value: ""

      - name: STRING_SESSION
        value: ""

      - name: MONGO_URL
        value: ""

      - name: DB_NAME
        value: "BadMusic"

      - name: API_URL
        value: ""

      - name: API_KEY
        value: ""

      - name: UPDATES_CHANNEL
        value: "https://t.me/PBX_UPDATE"

      - name: SUPPORT_GROUP
        value: "https://t.me/PBXCHATS"

      - name: WEBAPP_URL
        value: ""

      - name: MINIAPP_LINK
        value: ""

      - name: START_IMAGE
        value: "https://files.catbox.moe/skgu94.jpg"

      - name: PORT
        value: "8000"

    scaling:
      min: 1
      max: 1
